# Standalone stack for Dokploy (or any host where Traefik already terminates
# TLS and routes by domain). Differs from docker-compose.yml in two ways: no
# published ports, and the app joins the proxy's network so Traefik can reach
# it by service name.
#
# In Dokploy: create a Compose service, point it at this repository, set the
# compose path to ./docker-compose.dokploy.yml, fill in the Environment tab
# (see .env.example), then add a domain in the Domains tab -- service "app",
# port 3000. Set APP_URL to that same https:// domain.

name: dripline

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # These three are applied only while initialising an empty data
    # directory. Set them before the first deploy: changing them later
    # leaves the existing volume on the old credentials and the app can no
    # longer authenticate.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dripline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-dripline}
    volumes:
      - dripline_pg_data:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it pg_isready connects to a database named after
      # the user, so a custom POSTGRES_DB makes Postgres log a FATAL every
      # interval even though the check passes.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dripline} -d ${POSTGRES_DB:-dripline}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Docker's json-file driver keeps every line forever unless capped, so a
    # long-running install eventually fills the disk with request logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${DRIPLINE_IMAGE:-ghcr.io/mh-rafi/dripline}:${DRIPLINE_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-dripline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dripline}
      APP_URL: ${APP_URL:?set APP_URL in the environment}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment}
      TRACKING_SECRET: ${TRACKING_SECRET:?set TRACKING_SECRET in the environment}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Docker's json-file driver keeps every line forever unless capped, so a
    # long-running install eventually fills the disk with request logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  dripline_pg_data:
