services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dripline
      POSTGRES_PASSWORD: dripline
      POSTGRES_DB: dripline
    ports:
      - "5432:5432"
    volumes:
      - dripline_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dripline"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://dripline:dripline@postgres:5432/dripline
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      TRACKING_SECRET: ${TRACKING_SECRET:-change-me-tracking-secret}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  dripline_pg_data:
